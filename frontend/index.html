<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Search - Pipes & Minesweeper</title>

    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1>AI Search</h1>

    <!-- Puzzle selection -->
    <div>
        <button id="pipes-button">
            Pipes
        </button>

        <button id="minesweeper-button">
            Minesweeper
        </button>
    </div>

    <br>

    <!-- Puzzle controls -->
    <div id="configuration-controls">
        <label for="generator-select">
            Generator:
        </label>

        <select id="generator-select">
            <option value="tree">Tree-first</option>
            <option value="tile">Tile-driven</option>
        </select>

        <label for="solver-select">
            Mode / Solver:
        </label>

        <select id="solver-select">
            <option value="dfs">DFS</option>
            <option value="human">Human</option>
            <option value="astar" disabled>
                A* (not available)
            </option>
        </select>

        <button id="new-puzzle-button">
            New Puzzle
        </button>

        <button id="solve-instantly-button">
            Solve Instantly
        </button>

        <button id="solve-step-button">
            Solve Step by Step
        </button>
    </div>

    <div id="playback-controls">
        <button id="previous-step-button" disabled>
            Previous
        </button>

        <span id="playback-step">
            Step - / -
        </span>

        <button id="play-button" disabled>
            Play
        </button>

        <button id="pause-button" disabled>
            Pause
        </button>

        <button id="next-step-button" disabled>
            Next
        </button>
    </div>

    <br>

    <h2 id="puzzle-name">
        Select a puzzle
    </h2>

    <p id="puzzle-state">
        State: -
    </p>

    <!-- Puzzle board -->
    <div id="board">
    </div>

    <section id="move-history-section">
        <h3>Move History</h3>

        <ol id="move-history">
        </ol>
    </section>

    <br>

    <!-- Status -->
    <div>
        <p id="status">
            No puzzle selected.
        </p>

        <p>
            Algorithm:
            <span id="algorithm">-</span>
        </p>

        <p>
            Total actions:
            <span id="steps">-</span>
        </p>

        <p>
            Generation time:
            <span id="generation-time">-</span>
        </p>

        <p>
            Solver time:
            <span id="time">-</span>
        </p>

        <p>
            Expanded nodes:
            <span id="expanded-nodes">-</span>
        </p>
    </div>


    <script type="module" src="js/app.js"></script>

</body>

</html>
